<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hello World</title>
  </head>
  <body style="font-family: sans-serif; color: #032147">
    <h1>Hello World</h1>
    <p>API status: <span id="status" style="color: #209dd7">loading...</span></p>
    <script>
      fetch("/api/health")
        .then((response) => response.json())
        .then((data) => (document.getElementById("status").textContent = data.status));
    </script>
  </body>
</html>
